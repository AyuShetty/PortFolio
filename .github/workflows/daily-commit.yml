name: Daily Empty Commit

on:
  schedule:
    - cron: "0 3 * * *"   # Runs every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config user.name "AyuShetty"
          git config user.email "126095015+AyuShetty@users.noreply.github.com"

          git commit --allow-empty -m "Daily contribution: $(date -u +'%Y-%m-%d')"
          git push
